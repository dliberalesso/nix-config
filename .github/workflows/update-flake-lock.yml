name: "Update flake.lock"

on:
  schedule:
    - cron: "0 7 * * 0" # At 07:00 UTC on SUN
    - cron: "0 7 * * 1-6" # At 07:00 UTC from MON to SAT

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Installing Nix"
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            always-allow-substitutes = true
            experimental-features = flakes nix-command
          github_access_token: ${{ secrets.PAT }}

      - name: "Updating flake.lock"
        uses: DeterminateSystems/update-flake-lock@v29
        id: nix-update
        with:
          token: ${{ secrets.PAT }}
          nix-options: --accept-flake-config
          branch: "build/update-flake-lock"
          commit-msg: "⬆️ build: update flake.lock"
          git-author-name: Douglas Liberalesso
          git-author-email: dliberalesso@users.noreply.github.com
          git-committer-name: Douglas Liberalesso
          git-committer-email: dliberalesso@users.noreply.github.com
          pr-assignees: dliberalesso
          pr-labels: build, dependencies, nix
          pr-title: "⬆️ build: update flake.lock"

      - name: Adding PR Reference Footer
        if: steps.nix-update.outputs.pull-request-number != ''
        env:
          PR_NUMBER: ${{ steps.nix-update.outputs.pull-request-number }}
          PAT: ${{ secrets.PAT }}
        run: |
          git config user.name "Douglas Liberalesso"
          git config user.email "dliberalesso@users.noreply.github.com"
          git fetch origin build/update-flake-lock
          git checkout -B build/update-flake-lock FETCH_HEAD
          if git log -1 --format=%B | grep -qx "Refs: #${PR_NUMBER}"; then
            exit 0
          fi
          git commit --amend -m "$(git log -1 --format=%B)" -m "Refs: #${PR_NUMBER}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${PAT}" | base64)"
          git push --force origin build/update-flake-lock

      - name: Checking if Pull Request should Automerge
        if: (steps.nix-update.outputs.pull-request-operation == 'created' || steps.nix-update.outputs.pull-request-operation == 'updated') && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * 0')
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.PAT }}
          pull-request-number: ${{ steps.nix-update.outputs.pull-request-number }}
          merge-method: rebase
